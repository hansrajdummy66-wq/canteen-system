<!DOCTYPE html>
<html>
<head>
    <title>Order Successful</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f7f6; padding: 50px; }
        .card { background: white; max-width: 500px; margin: auto; padding: 30px; border-radius: 10px; border-top: 10px solid #28a745; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .pin { background: #fff3cd; color: #856404; padding: 20px; font-size: 2em; font-weight: bold; border-radius: 10px; margin: 20px 0; border: 2px dashed #ffe8a1; }
    </style>
</head>
<body>
    <div class="card">
        <h1 style="color:#28a745;">✅ Order Confirmed</h1>
        <h2>Order Ref: {{ order.order_ref }}</h2>
        <div class="pin">
            <small style="font-size:12px; display:block;">SECRET PIN</small>
            {{ order.collection_pin }}
        </div>
        <p>Please pay <strong>₹{{ order.total_price }}</strong> at the counter.</p>
        <div style="background:#f8f9fa; padding:15px; text-align:left; border-radius:5px;">
            <strong>{{ order.student_name }}</strong> (Roll: {{ order.roll_number }}, {{ order.student_class }})<br>
            Items: {{ order.items }}
        </div><br>
        <a href="/" style="padding:10px 20px; background:#007bff; color:white; text-decoration:none; border-radius:5px;">Back to Menu</a>
    </div>
</body>
</html>
