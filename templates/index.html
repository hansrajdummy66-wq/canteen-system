<!DOCTYPE html>
<html>
<head>
    <title>School Canteen Menu</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f4f7f6; }
        .box { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .btn { width: 100%; padding: 15px; background: #ff6b6b; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1 style="text-align:center;">🏫 Canteen Ordering System</h1>
    {% if is_open %}
    <form method="POST">
        <div class="box">
            <h3>Student Details</h3>
            <label>Name:</label> <input type="text" name="student_name" required>
            <label>Roll Number:</label> <input type="number" name="roll_number" required min="1">
            <label>Class/Stream:</label>
            <select name="class_section" required>
                {% for c in range(5, 11) %}{% for sec in ['A', 'B', 'C', 'D'] %}<option value="{{c}}-{{sec}}">Class {{c}}-{{sec}}</option>{% endfor %}{% endfor %}
                {% for c in [11, 12] %}{% for stream in ['NonMed', 'Med', 'Commerce', 'Humanities'] %}<option value="{{c}}-{{stream}}">Class {{c}}-{{stream}}</option>{% endfor %}{% endfor %}
            </select>
            <p style="background:#e3f2fd; padding:10px; border-radius:5px;">💵 Payment: Cash (Pay at counter)</p>
        </div>

        <div class="grid">
            {% for item in menu %}
            <div class="card">
                <img src="{{item.image}}">
                <h4 style="margin:5px 0;">{{item.name}}</h4>
                <p style="color:green; font-weight:bold; margin:5px 0;">₹{{item.price}}</p>
                <div style="background:#f8f9fa; padding:10px; border-radius:5px;">
                    <input type="checkbox" name="items" value="{{item.id}}"> Add | Qty: 
                    <input type="number" name="qty_{{item.id}}" value="1" min="1" style="width:50px; padding:2px; margin:0;">
                </div>
            </div>
            {% endfor %}
        </div><br>
        <button type="submit" class="btn">Place Order</button>
    </form>
    {% else %}
    <h2 style="text-align:center; color:red; margin-top:50px;">⛔ Orders closed. Cutoff is 7:45 AM.</h2>
    {% endif %}
</body>
</html>
